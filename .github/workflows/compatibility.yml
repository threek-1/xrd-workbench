name: Clean installation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-15-intel
            python: '3.12'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install, analyze, replay and start server in clean environments
        run: python -I scripts/ci_isolation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/
          retention-days: 7
